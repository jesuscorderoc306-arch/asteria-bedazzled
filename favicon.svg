<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<style>
  .dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .light { display: none; }
    .dark { display: inline; }
  }
</style>
<image class="light" href="data:image/png;base64," width="256" height="256"/>
<image class="dark" href="data:image/png;base64," width="256" height="256"/>
</svg>